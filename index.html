<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RHI MAGNESITA SPARE STOCK REGISTER</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      text-align: center;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 8px;
      color: #1f2937;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #166534;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #14532d;
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>RHI MAGNESITA</h1>
    <div class="subtitle">SPARE STOCK REGISTER</div>

    <input type="text" id="username" placeholder="Enter Username">

    <input type="password" id="password" placeholder="Enter Password">

    <button onclick="login()">LOGIN</button>

    <div class="footer">
      RHI Magnesita Spare Stock Management System
    </div>

  </div>

  <script>
    function login() {
      alert("Login system will be connected to Supabase in the next step.");
    }
  </script>

</body>
</html>
