<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RHI MAGNESITA - Spare Stock Register</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

.container{
    max-width:1200px;
    margin:20px auto;
    padding:15px;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 15px #ccc;
}

h1,h2{
    text-align:center;
}

input,select,button{
    width:100%;
    padding:11px;
    margin:5px 0;
    border-radius:6px;
    border:1px solid #ccc;
    font-size:15px;
}

button{
    background:#b00000;
    color:white;
    border:none;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#800000;
}

.hidden{
    display:none;
}

.msg{
    text-align:center;
    margin:10px 0;
    font-weight:bold;
}

.logout{
    background:#555;
    max-width:130px;
    float:right;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
    min-width:900px;
}

th,td{
    border:1px solid #ddd;
    padding:9px;
    text-align:center;
}

th{
    background:#b00000;
    color:white;
}

.action-btn{
    width:auto;
    padding:6px 9px;
    margin:2px;
    font-size:13px;
}

.edit-btn{
    background:#1769aa;
}

.delete-btn{
    background:#d00000;
}

.section{
    margin-top:25px;
}

.total{
    font-weight:bold;
}

@media(max-width:700px){
    .form-grid{
        grid-template-columns:1fr;
    }

    .container{
        padding:8px;
    }

    .card{
        padding:12px;
    }

    h1{
        font-size:24px;
    }

    h2{
        font-size:18px;
    }
}
</style>
</head>

<body>

<div class="container">

<div id="loginPage" class="card">

<h1>RHI MAGNESITA</h1>
<h2>SPARE STOCK REGISTER</h2>

<input
type="email"
id="loginEmail"
placeholder="Email">

<input
type="password"
id="loginPassword"
placeholder="Password">

<button id="loginButton">
LOGIN
</button>

<div id="loginMessage" class="msg"></div>

</div>

<div id="mainPage" class="card hidden">

<button id="logoutButton" class="logout">
LOGOUT
</button>

<h1>RHI MAGNESITA</h1>
<h2>SPARE STOCK REGISTER</h2>

<hr>

<h3>ADD STOCK</h3>

<div class="form-grid">

<input
type="text"
id="itemName"
placeholder="Item Name">

<input
type="text"
id="itemCode"
placeholder="Item Code">

<input
type="number"
id="stock"
placeholder="Stock"
min="0">

<input
type="number"
id="received"
placeholder="Received"
min="0">

<input
type="date"
id="receivedDate">

<input
type="text"
id="remarks"
placeholder="Remarks">

</div>

<button id="addButton">
ADD STOCK
</button>

<div id="stockMessage" class="msg"></div>

<hr>

    <h3>STOCK REGISTER</h3>

<div class="table-wrap">

<table>

<thead>

<tr>
<th>SR.NO</th>
<th>ITEM NAME</th>
<th>ITEM CODE</th>
<th>STOCK</th>
<th>RECEIVED</th>
<th>CONSUMPTION</th>
<th>TOTAL STOCK</th>
<th>REMARKS</th>
<th>ACTION</th>
</tr>

</thead>

<tbody id="stockTable">
</tbody>

</table>

</div>


<div class="section">

<h3>CONSUMPTION</h3>

<div class="form-grid">

<select id="consumptionItem">
<option value="">Select Item</option>
</select>

<input
type="number"
id="consumptionQty"
placeholder="Consumption Quantity"
min="1">

<input
type="date"
id="consumptionDate">

<input
type="text"
id="consumptionRemarks"
placeholder="Remarks">

</div>

<button id="consumptionButton">
ADD CONSUMPTION
</button>

<div id="consumptionMessage" class="msg"></div>

</div>


<div class="section">

<h3>CONSUMPTION HISTORY</h3>

<div class="table-wrap">

<table>

<thead>

<tr>
<th>SR.NO</th>
<th>DATE</th>
<th>ITEM NAME</th>
<th>ITEM CODE</th>
<th>QUANTITY</th>
<th>REMARKS</th>
</tr>

</thead>

<tbody id="historyTable">
</tbody>

</table>

</div>

</div>

</div>

</div>


<script>

/* SUPABASE */

const SUPABASE_URL =
"https://mooagaasvythwctcktcx.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_Zql7qJbZlj1R5H1ydOoqSg_F0WAdgd0";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);


/* ELEMENTS */

const loginPage =
document.getElementById("loginPage");

const mainPage =
document.getElementById("mainPage");

const loginMessage =
document.getElementById("loginMessage");

const stockMessage =
document.getElementById("stockMessage");

const consumptionMessage =
document.getElementById("consumptionMessage");

const stockTable =
document.getElementById("stockTable");

const historyTable =
document.getElementById("historyTable");

const consumptionItem =
document.getElementById("consumptionItem");


/* LOGIN */

async function login(){

const email =
document.getElementById("loginEmail")
.value.trim();

const password =
document.getElementById("loginPassword")
.value;

if(!email || !password){

loginMessage.style.color="red";

loginMessage.textContent=
"Enter Email and Password.";

return;
}

loginMessage.textContent=
"Logging in...";

const {error} =
await supabaseClient.auth.signInWithPassword({

email:email,

password:password

});

if(error){

loginMessage.style.color="red";

loginMessage.textContent=
error.message;

return;
}

loginPage.classList.add("hidden");

mainPage.classList.remove("hidden");

loadAll();

}


/* LOGOUT */

async function logout(){

await supabaseClient.auth.signOut();

mainPage.classList.add("hidden");

loginPage.classList.remove("hidden");

}


/* ADD STOCK */

async function addStock(){

const name =
document.getElementById("itemName")
.value.trim();

const code =
document.getElementById("itemCode")
.value.trim();

const stock =
Number(
document.getElementById("stock").value || 0
);

const received =
Number(
document.getElementById("received").value || 0
);

const receivedDate =
document.getElementById("receivedDate").value ||
new Date().toISOString().split("T")[0];

const remarks =
document.getElementById("remarks")
.value.trim();


if(!name){

showStockMessage(
"Please enter Item Name.",
"red"
);

return;
}

if(!code){

showStockMessage(
"Please enter Item Code.",
"red"
);

return;
}

if(stock<0 || received<0){

showStockMessage(
"Stock cannot be negative.",
"red"
);

return;
}


const {error} =
await supabaseClient
.from("stock_items")
.insert({

item_name:name,

item_code:code,

stock:stock,

received:received,

received_date:receivedDate,

remarks:remarks

});


if(error){

showStockMessage(
error.message,
"red"
);

return;
}


showStockMessage(
"Stock added successfully.",
"green"
);


document.getElementById("itemName").value="";

document.getElementById("itemCode").value="";

document.getElementById("stock").value="";

document.getElementById("received").value="";

document.getElementById("receivedDate").value="";

document.getElementById("remarks").value="";


loadAll();

}


/* LOAD STOCK */

async function loadStock(){

stockTable.innerHTML="";


const {data,error} =
await supabaseClient
.from("stock_items")
.select("*")
.order("id",{ascending:true});


if(error){

stockTable.innerHTML=
`<tr>
<td colspan="9">
${escapeHtml(error.message)}
</td>
</tr>`;

return;
}


if(!data || data.length===0){

stockTable.innerHTML=
`<tr>
<td colspan="9">
No stock found.
</td>
</tr>`;

return;
}


for(let i=0;i<data.length;i++){

const item=data[i];

const consumption =
await getTotalConsumption(item.id);


const total =
Number(item.stock || 0) +
Number(item.received || 0) -
Number(consumption || 0);


const row=
document.createElement("tr");


row.innerHTML=`

<td>${i+1}</td>

<td>
${escapeHtml(item.item_name)}
</td>

<td>
${escapeHtml(item.item_code)}
</td>

<td>
${Number(item.stock || 0)}
</td>

<td>
${Number(item.received || 0)}
</td>

<td>
${Number(consumption || 0)}
</td>

<td class="total">
${total}
</td>

<td>
${escapeHtml(item.remarks || "")}
</td>

<td>

<button
class="action-btn edit-btn"
onclick="editStock(${item.id})">
EDIT
</button>

<button
class="action-btn delete-btn"
onclick="deleteStock(${item.id})">
DELETE
</button>

</td>

`;


stockTable.appendChild(row);

}

}


/* TOTAL CONSUMPTION */

async function getTotalConsumption(stockId){

const {data,error} =
await supabaseClient
.from("consumption_history")
.select("quantity")
.eq("stock_item_id",stockId);


if(error){

console.error(error);

return 0;
}


return (data || []).reduce(
(sum,row)=>
sum + Number(row.quantity || 0),
0
);

}


/* CONSUMPTION ITEMS */

async function loadConsumptionItems(){

consumptionItem.innerHTML=
`<option value="">
Select Item
</option>`;


const {data,error} =
await supabaseClient
.from("stock_items")
.select("id,item_name,item_code")
.order("item_name");


if(error){

console.error(error);

return;
}


(data || []).forEach(item=>{

const option=
document.createElement("option");

option.value=item.id;

option.textContent=
item.item_name +
" - " +
item.item_code;

consumptionItem.appendChild(option);

});

}

    /* =====================================================
   ADD CONSUMPTION
===================================================== */

async function addConsumption(){

    const stockId =
    Number(
        consumptionItem.value
    );

    const qty =
    Number(
        document.getElementById(
            "consumptionQty"
        ).value
    );

    const date =
    document.getElementById(
        "consumptionDate"
    ).value ||
    new Date().toISOString().split("T")[0];

    const remarks =
    document.getElementById(
        "consumptionRemarks"
    ).value.trim();


    if(!stockId){

        showConsumptionMessage(
            "Please select Item.",
            "red"
        );

        return;
    }


    if(!qty || qty <= 0){

        showConsumptionMessage(
            "Please enter valid quantity.",
            "red"
        );

        return;
    }


    const {data:item,error:itemError} =
    await supabaseClient
    .from("stock_items")
    .select("*")
    .eq("id",stockId)
    .single();


    if(itemError){

        showConsumptionMessage(
            itemError.message,
            "red"
        );

        return;
    }


    const alreadyUsed =
    await getTotalConsumption(stockId);


    const available =
    Number(item.stock || 0) +
    Number(item.received || 0) -
    Number(alreadyUsed || 0);


    if(qty > available){

        showConsumptionMessage(
            "Consumption is greater than available stock.",
            "red"
        );

        return;
    }


    const {error} =
    await supabaseClient
    .from("consumption_history")
    .insert({

        stock_item_id:stockId,

        item_name:item.item_name,

        item_code:item.item_code,

        quantity:qty,

        consumption_date:date,

        remarks:remarks

    });


    if(error){

        showConsumptionMessage(
            error.message,
            "red"
        );

        return;
    }


    showConsumptionMessage(
        "Consumption added successfully.",
        "green"
    );


    document.getElementById(
        "consumptionQty"
    ).value="";

    document.getElementById(
        "consumptionDate"
    ).value="";

    document.getElementById(
        "consumptionRemarks"
    ).value="";

    consumptionItem.value="";


    loadAll();

}


/* =====================================================
   CONSUMPTION HISTORY
===================================================== */

async function loadHistory(){

    historyTable.innerHTML="";


    const {data,error} =
    await supabaseClient
    .from("consumption_history")
    .select("*")
    .order(
        "consumption_date",
        {ascending:false}
    )
    .order(
        "id",
        {ascending:false}
    );


    if(error){

        historyTable.innerHTML=
        `<tr>
            <td colspan="6">
                ${escapeHtml(error.message)}
            </td>
        </tr>`;

        return;
    }


    if(!data || data.length===0){

        historyTable.innerHTML=
        `<tr>
            <td colspan="6">
                No consumption history.
            </td>
        </tr>`;

        return;
    }


    data.forEach(
        (item,index)=>{

            const row =
            document.createElement("tr");


            row.innerHTML=`

                <td>${index+1}</td>

                <td>
                    ${escapeHtml(
                        item.consumption_date || ""
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        item.item_name || ""
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        item.item_code || ""
                    )}
                </td>

                <td>
                    ${Number(
                        item.quantity || 0
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        item.remarks || ""
                    )}
                </td>

            `;


            historyTable.appendChild(row);

        }
    );

}


/* =====================================================
   EDIT STOCK
===================================================== */

async function editStock(id){

    const {data,error} =
    await supabaseClient
    .from("stock_items")
    .select("*")
    .eq("id",id)
    .single();


    if(error){

        alert(error.message);

        return;
    }


    const name =
    prompt(
        "Item Name:",
        data.item_name
    );

    if(name===null) return;


    const code =
    prompt(
        "Item Code:",
        data.item_code
    );

    if(code===null) return;


    const stock =
    prompt(
        "Stock:",
        data.stock || 0
    );

    if(stock===null) return;


    const received =
    prompt(
        "Received:",
        data.received || 0
    );

    if(received===null) return;


    const remarks =
    prompt(
        "Remarks:",
        data.remarks || ""
    );

    if(remarks===null) return;


    const {error:updateError} =
    await supabaseClient
    .from("stock_items")
    .update({

        item_name:name.trim(),

        item_code:code.trim(),

        stock:Number(stock),

        received:Number(received),

        remarks:remarks.trim()

    })
    .eq("id",id);


    if(updateError){

        alert(updateError.message);

        return;
    }


    alert(
        "Stock updated successfully."
    );


    loadAll();

}


/* =====================================================
   DELETE STOCK
===================================================== */

async function deleteStock(id){

    const ok =
    confirm(
        "Are you sure you want to delete this item?"
    );


    if(!ok) return;


    const {error:historyError} =
    await supabaseClient
    .from("consumption_history")
    .delete()
    .eq("stock_item_id",id);


    if(historyError){

        alert(historyError.message);

        return;
    }


    const {error} =
    await supabaseClient
    .from("stock_items")
    .delete()
    .eq("id",id);


    if(error){

        alert(error.message);

        return;
    }


    alert(
        "Item deleted successfully."
    );


    loadAll();

}


/* =====================================================
   LOAD EVERYTHING
===================================================== */

async function loadAll(){

    await loadStock();

    await loadConsumptionItems();

    await loadHistory();

}


/* =====================================================
   MESSAGES
===================================================== */

function showStockMessage(
    text,
    color
){

    stockMessage.style.color =
    color;

    stockMessage.textContent =
    text;

}


function showConsumptionMessage(
    text,
    color
){

    consumptionMessage.style.color =
    color;

    consumptionMessage.textContent =
    text;

}


/* =====================================================
   SECURITY
===================================================== */

function escapeHtml(value){

    return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================================
   BUTTON EVENTS
===================================================== */

document.getElementById(
    "loginButton"
)
.addEventListener(
    "click",
    login
);


document.getElementById(
    "logoutButton"
)
.addEventListener(
    "click",
    logout
);


document.getElementById(
    "addButton"
)
.addEventListener(
    "click",
    addStock
);


document.getElementById(
    "consumptionButton"
)
.addEventListener(
    "click",
    addConsumption
);


/* =====================================================
   ENTER KEY LOGIN
===================================================== */

document.getElementById(
    "loginPassword"
)
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            login();

        }

    }
);


/* =====================================================
   CHECK SESSION
===================================================== */

async function checkSession(){

    const {data} =
    await supabaseClient
    .auth
    .getSession();


    if(
        data &&
        data.session
    ){

        loginPage.classList.add(
            "hidden"
        );

        mainPage.classList.remove(
            "hidden"
        );

        loadAll();

    }

}


checkSession();

</script>

</body>
</html>
