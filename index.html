<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RHI MAGNESITA - Spare Stock Register</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

.container{
    width:98%;
    max-width:1500px;
    margin:25px auto;
    padding:10px;
}

.card{
    background:#fff;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 15px #ccc;
}

.header{
    position:relative;
    text-align:center;
    padding:5px 160px 10px 160px;
}

.header h1{
    margin:0 0 12px 0;
    font-size:30px;
}

.header h2{
    margin:0;
    font-size:24px;
}

.logout{
    position:absolute;
    right:0;
    top:0;
    width:140px;
    padding:12px;
    background:#555;
}

h1,h2{
    text-align:center;
}

input,button{
    width:100%;
    padding:11px;
    margin:6px 0;
    border-radius:5px;
    border:1px solid #ccc;
    font-size:15px;
}

button{
    background:#b00000;
    color:white;
    border:none;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#800000;
}

.hidden{
    display:none;
}

.msg{
    text-align:center;
    margin:10px 0;
    font-weight:bold;
}

/* ADD STOCK FORM */

.stock-form{
    display:grid;
    grid-template-columns:
        1.4fr 1fr 1fr 1fr 1fr 1.2fr 1.5fr;
    gap:8px;
    align-items:end;
}

.field label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:2px;
}

/* TABLE */

.table-wrap{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    min-width:1250px;
    border-collapse:collapse;
    margin-top:15px;
    table-layout:fixed;
}

th,td{
    border:1px solid #ddd;
    padding:10px 7px;
    text-align:center;
    vertical-align:middle;
    overflow-wrap:anywhere;
}

th{
    background:#b00000;
    color:#fff;
    font-size:13px;
    white-space:normal;
}

td{
    font-size:14px;
}

th:nth-child(1),
td:nth-child(1){
    width:60px;
}

th:nth-child(2),
td:nth-child(2){
    width:170px;
    text-align:left;
}

th:nth-child(3),
td:nth-child(3){
    width:120px;
}

th:nth-child(4),
td:nth-child(4),
th:nth-child(5),
td:nth-child(5),
th:nth-child(6),
td:nth-child(6),
th:nth-child(8),
td:nth-child(8),
th:nth-child(9),
td:nth-child(9){
    width:110px;
}

th:nth-child(7),
td:nth-child(7){
    width:130px;
}

th:nth-child(10),
td:nth-child(10){
    width:180px;
    text-align:left;
}

@media(max-width:800px){

    .container{
        width:100%;
        margin:10px auto;
        padding:5px;
    }

    .card{
        padding:15px;
    }

    .header{
        padding:55px 0 10px 0;
    }

    .header h1{
        font-size:24px;
    }

    .header h2{
        font-size:19px;
    }

    .logout{
        right:0;
        top:0;
        width:110px;
    }

    .stock-form{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->

<div id="loginPage" class="card">

    <h1>RHI MAGNESITA</h1>
    <h2>SPARE STOCK REGISTER</h2>

    <input
        type="email"
        id="loginEmail"
        placeholder="Email"
    >

    <input
        type="password"
        id="loginPassword"
        placeholder="Password"
    >

    <button id="loginButton" type="button">
        LOGIN
    </button>

    <div id="loginMessage" class="msg"></div>

</div>


<!-- MAIN PAGE -->

<div id="mainPage" class="card hidden">

    <div class="header">

        <button
            id="logoutButton"
            class="logout"
            type="button">
            LOGOUT
        </button>

        <h1>RHI MAGNESITA</h1>
        <h2>SPARE STOCK REGISTER</h2>

    </div>

    <hr>

    <h3>ADD STOCK</h3>

    <div class="stock-form">

        <div class="field">
            <label>ITEM NAME</label>
            <input
                type="text"
                id="itemName"
                placeholder="Item Name">
        </div>

        <div class="field">
            <label>ITEM CODE</label>
            <input
                type="text"
                id="itemCode"
                placeholder="Item Code">
        </div>

        <div class="field">
            <label>OPEN STOCK</label>
            <input
                type="number"
                id="openStock"
                placeholder="0"
                min="0">
        </div>

        <div class="field">
            <label>RECEIVED</label>
            <input
                type="number"
                id="received"
                placeholder="0"
                min="0">
        </div>

        <div class="field">
            <label>CLOSE STOCK</label>
            <input
                type="number"
                id="closeStock"
                placeholder="0"
                min="0">
        </div>

        <div class="field">
            <label>RECEIVED DATE</label>
            <input
                type="date"
                id="receivedDate">
        </div>

        <div class="field">
            <label>REMARKS</label>
            <input
                type="text"
                id="remarks"
                placeholder="Remarks">
        </div>

    </div>

    <button id="addButton" type="button">
        ADD STOCK
    </button>

    <div id="stockMessage" class="msg"></div>

    <hr>

    <h3>STOCK REGISTER</h3>

    <div class="table-wrap">

        <table>

            <thead>
                <tr>
                    <th>SR.NO</th>
                    <th>ITEM NAME</th>
                    <th>ITEM CODE</th>
                    <th>CLOSE STOCK</th>
                    <th>OPEN STOCK</th>
                    <th>RECEIVED</th>
                    <th>RECEIVED DATE</th>
                    <th>CONSUMPTION</th>
                    <th>TOTAL STOCK</th>
                    <th>REMARKS</th>
                </tr>
            </thead>

            <tbody id="stockTable">
            </tbody>

        </table>

    </div>

</div>

</div>


<script>

/* ==========================
   SUPABASE
========================== */

const SUPABASE_URL =
"https://mooagaasvythwctcktcx.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_Zql7qJbZlj1R5H1ydOoqSg_F0WAdgd0";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* ==========================
   ELEMENTS
========================== */

const loginPage =
document.getElementById("loginPage");

const mainPage =
document.getElementById("mainPage");

const loginButton =
document.getElementById("loginButton");

const logoutButton =
document.getElementById("logoutButton");

const loginMessage =
document.getElementById("loginMessage");

const stockMessage =
document.getElementById("stockMessage");

const stockTable =
document.getElementById("stockTable");


/* ==========================
   LOGIN
========================== */

async function login(){

    const email =
    document.getElementById("loginEmail")
    .value.trim();

    const password =
    document.getElementById("loginPassword")
    .value;

    if(!email || !password){

        loginMessage.style.color="red";

        loginMessage.textContent =
        "Enter Email and Password.";

        return;
    }

    loginMessage.style.color="#333";
    loginMessage.textContent="Logging in...";

    try{

        const result =
        await supabaseClient.auth
        .signInWithPassword({
            email:email,
            password:password
        });

        if(result.error){

            loginMessage.style.color="red";

            loginMessage.textContent =
            result.error.message;

            return;
        }

        loginPage.classList.add("hidden");
        mainPage.classList.remove("hidden");

        loginMessage.textContent="";

        loadStock();

    }catch(error){

        loginMessage.style.color="red";

        loginMessage.textContent =
        "Login error: " + error.message;
    }
}


/* ==========================
   LOGOUT
========================== */

async function logout(){

    await supabaseClient.auth.signOut();

    mainPage.classList.add("hidden");

    loginPage.classList.remove("hidden");

    document.getElementById(
        "loginPassword"
    ).value="";

    loginMessage.textContent="";
}


/* ==========================
   ADD STOCK
========================== */

async function addStock(){

    const name =
    document.getElementById("itemName")
    .value.trim();

    const code =
    document.getElementById("itemCode")
    .value.trim();

    const openStock =
    Number(
        document.getElementById(
            "openStock"
        ).value || 0
    );

    const received =
    Number(
        document.getElementById(
            "received"
        ).value || 0
    );

    const closeStock =
    Number(
        document.getElementById(
            "closeStock"
        ).value || 0
    );

    const receivedDate =
    document.getElementById(
        "receivedDate"
    ).value;

    const remarks =
    document.getElementById(
        "remarks"
    ).value.trim();


    if(!name){

        showMessage(
            "Please enter Item Name.",
            "red"
        );

        return;
    }

    if(!code){

        showMessage(
            "Please enter Item Code.",
            "red"
        );

        return;
    }

    if(
        openStock < 0 ||
        received < 0 ||
        closeStock < 0
    ){

        showMessage(
            "Stock cannot be negative.",
            "red"
        );

        return;
    }

    const available =
        openStock + received;

    if(closeStock > available){

        showMessage(
            "Close Stock cannot be more than Open Stock + Received.",
            "red"
        );

        return;
    }

    showMessage(
        "Saving...",
        "#333"
    );

    try{

        const {error} =
        await supabaseClient
        .from("stock_items")
        .insert({

            item_name:name,
            item_code:code,

            open_stock:openStock,
            received:received,
            close_stock:closeStock,

            received_date:
                receivedDate || null,

            remarks:remarks
        });

        if(error){

            console.error(error);

            showMessage(
                error.message,
                "red"
            );

            return;
        }

        showMessage(
            "Stock added successfully.",
            "green"
        );

        clearForm();

        loadStock();

    }catch(error){

        console.error(error);

        showMessage(
            "Error: " + error.message,
            "red"
        );
    }
}


/* ==========================
   CLEAR FORM
========================== */

function clearForm(){

    document.getElementById(
        "itemName"
    ).value="";

    document.getElementById(
        "itemCode"
    ).value="";

    document.getElementById(
        "openStock"
    ).value="";

    document.getElementById(
        "received"
    ).value="";

    document.getElementById(
        "closeStock"
    ).value="";

    document.getElementById(
        "receivedDate"
    ).value="";

    document.getElementById(
        "remarks"
    ).value="";
}


/* ==========================
   LOAD STOCK
========================== */

async function loadStock(){

    stockTable.innerHTML="";

    try{

        const {data,error} =
        await supabaseClient
        .from("stock_items")
        .select("*")
        .order(
            "id",
            {ascending:true}
        );

        if(error){

            console.error(error);

            stockTable.innerHTML =
            "<tr><td colspan='10'>Unable to load stock.</td></tr>";

            return;
        }

        if(!data || data.length===0){

            stockTable.innerHTML =
            "<tr><td colspan='10'>No stock found.</td></tr>";

            return;
        }

        data.forEach((item,index)=>{

            const openStock =
                Number(item.open_stock || 0);

            const received =
                Number(item.received || 0);

            const closeStock =
                Number(item.close_stock || 0);

            const consumption =
                openStock +
                received -
                closeStock;

            const totalStock =
                closeStock;

            const row =
            document.createElement("tr");

            row.innerHTML = `

                <td>${index + 1}</td>

                <td>
                    ${escapeHtml(
                        item.item_name || ""
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        item.item_code || ""
                    )}
                </td>

                <td>${closeStock}</td>

                <td>${openStock}</td>

                <td>${received}</td>

                <td>
                    ${formatDate(
                        item.received_date
                    )}
                </td>

                <td>${consumption}</td>

                <td>${totalStock}</td>

                <td>
                    ${escapeHtml(
                        item.remarks || ""
                    )}
                </td>
            `;

            stockTable.appendChild(row);
        });

    }catch(error){

        console.error(error);

        stockTable.innerHTML =
        "<tr><td colspan='10'>Error loading stock.</td></tr>";
    }
}


/* ==========================
   DATE
========================== */

function formatDate(date){

    if(!date){
        return "";
    }

    const parts =
    date.split("-");

    if(parts.length !== 3){
        return date;
    }

    return (
        parts[2] + "-" +
        parts[1] + "-" +
        parts[0]
    );
}


/* ==========================
   MESSAGE
========================== */

function showMessage(text,color){

    stockMessage.style.color=color;

    stockMessage.textContent=text;
}


/* ==========================
   SECURITY
========================== */

function escapeHtml(value){

    return String(value)

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* ==========================
   BUTTONS
========================== */

loginButton.addEventListener(
    "click",
    login
);

logoutButton.addEventListener(
    "click",
    logout
);

document.getElementById(
    "addButton"
)
.addEventListener(
    "click",
    addStock
);


/* ==========================
   ENTER LOGIN
========================== */

document.getElementById(
    "loginPassword"
)
.addEventListener(
    "keydown",
    function(event){

        if(event.key==="Enter"){
            login();
        }
    }
);


/* ==========================
   SESSION
========================== */

async function checkSession(){

    try{

        const {data} =
        await supabaseClient.auth
        .getSession();

        if(data && data.session){

            loginPage.classList.add(
                "hidden"
            );

            mainPage.classList.remove(
                "hidden"
            );

            loadStock();
        }

    }catch(error){

        console.error(error);
    }
}

checkSession();

</script>

</body>
</html>
