body{

.container{

.card{

h1,h2{

input,select,button{

button{
    background:#b00000;
    color:white;
    border:none;
    cursor:pointer;
    font-weight:bold;
}

button:hover{

}

.hidden{
    display:none;
}

.msg{

    margin:10px 0;

.logout{

    max-width:130px;

}

.form-grid{
    display:grid;

}

.table-wrap{

table{

th,td{

th{

}

.action-btn{
    width:auto;

}

.edit-btn{

}

.delete-btn{
    background:#d00000;
}

.section{
    margin-top:25px;
}

.total{
    font-weight:bold;
}

@media(max-width:700px){
    .form-grid{
        grid-template-columns:1fr;
    }

    .container{
        padding:8px;
    }

    .card{
        padding:12px;
    }

    h1{
        font-size:24px;
    }

    h2{
        font-size:18px;
    }
}
</style>
</head>

<script>

/* =====================================================
   SUPABASE SETTINGS
   ===================================================== */

const SUPABASE_URL =
"https://mooagaasvythwctcktcx.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_Zql7qJbZlj1j1R5H1ydOoqSg_F0WAdgd0";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =====================================================
   ELEMENTS
   ===================================================== */

const loginPage =
document.getElementById("loginPage");

const mainPage =
document.getElementById("mainPage");

const loginMessage =
document.getElementById("loginMessage");

const stockMessage =
document.getElementById("stockMessage");

const consumptionMessage =
document.getElementById("consumptionMessage");

const stockTable =
document.getElementById("stockTable");

const historyTable =
document.getElementById("historyTable");

const consumptionItem =
document.getElementById("consumptionItem");


/* =====================================================
   LOGIN
   ===================================================== */

async function login(){

    const email =
    document.getElementById("loginEmail")
    .value.trim();

    const password =
    document.getElementById("loginPassword")
    .value;

    if(!email || !password){

        loginMessage.style.color="red";
        loginMessage.textContent =
        "Enter Email and Password.";

        return;
    }

    loginMessage.textContent =
    "Logging in...";

    const {error} =
    await supabaseClient.auth.signInWithPassword({
        email:email,
        password:password
    });

    if(error){

        loginMessage.style.color="red";
        loginMessage.textContent =
        error.message;

        return;
    }

    loginMessage.style.color="green";
    loginMessage.textContent =
    "Login successful.";

    loginPage.classList.add("hidden");
    mainPage.classList.remove("hidden");

    loadAll();

}


/* =====================================================
   LOGOUT
   ===================================================== */

async function logout(){

    await supabaseClient.auth.signOut();

    mainPage.classList.add("hidden");
    loginPage.classList.remove("hidden");

}


/* =====================================================
   ADD STOCK
   ===================================================== */

async function addStock(){

    const name =
    document.getElementById("itemName")
    .value.trim();

    const code =
    document.getElementById("itemCode")
    .value.trim();

    const stock =
    Number(document.getElementById("stock").value || 0);

    const received =
    Number(document.getElementById("received").value || 0);

    const receivedDate =
    document.getElementById("receivedDate").value ||
    new Date().toISOString().split("T")[0];

    const remarks =
    document.getElementById("remarks")
    .value.trim();


    if(!name){

        showStockMessage(
            "Please enter Item Name.",
            "red"
        );

        return;
    }

    if(!code){

        showStockMessage(
            "Please enter Item Code.",
            "red"
        );

        return;
    }


    showStockMessage(
        "Saving...",
        "#333"
    );


    const {error} =
    await supabaseClient
    .from("stock_items")
    .insert({

        item_name:name,
        item_code:code,
        stock:stock,
        received:received,
        received_date:receivedDate,
        remarks:remarks

    });


    if(error){

        console.error(error);

        showStockMessage(
            error.message,
            "red"
        );

        return;
    }


    showStockMessage(
        "Stock added successfully.",
        "green"
    );


    document.getElementById("itemName").value="";
    document.getElementById("itemCode").value="";
    document.getElementById("stock").value="";
    document.getElementById("received").value="";
    document.getElementById("receivedDate").value="";
    document.getElementById("remarks").value="";


    loadAll();

}


/* =====================================================
   LOAD STOCK
   ===================================================== */

async function loadStock(){

    stockTable.innerHTML="";

    const {data,error} =
    await supabaseClient
    .from("stock_items")
    .select("*")
    .order("id",{ascending:true});


    if(error){

        console.error(error);

        stockTable.innerHTML =
        `<tr>
            <td colspan="9">
                ${escapeHtml(error.message)}
            </td>
        </tr>`;

        return;
    }


    if(!data || data.length===0){

        stockTable.innerHTML =
        `<tr>
            <td colspan="9">
                No stock found.
            </td>
        </tr>`;

        return;
    }


    for(let i=0;i<data.length;i++){

        const item=data[i];

        const consumption =
        await getTotalConsumption(item.id);

        const total =
        Number(item.stock || 0) +
        Number(item.received || 0) -
        Number(consumption || 0);


        const row =
        document.createElement("tr");


        row.innerHTML=`

            <td>${i+1}</td>

            <td>
                ${escapeHtml(item.item_name)}
            </td>

            <td>
                ${escapeHtml(item.item_code)}
            </td>

            <td>
                ${Number(item.stock || 0)}
            </td>

            <td>
                ${Number(item.received || 0)}
            </td>

            <td>
                ${Number(consumption || 0)}
            </td>

            <td class="total">
                ${total}
            </td>

            <td>
                ${escapeHtml(item.remarks || "")}
            </td>

            <td>

                <button
                    class="action-btn edit-btn"
                    onclick="editStock(${item.id})">
                    EDIT
                </button>

                <button
                    class="action-btn delete-btn"
                    onclick="deleteStock(${item.id})">
                    DELETE
                </button>

            </td>
        `;


        stockTable.appendChild(row);

    }

}


/* =====================================================
   GET TOTAL CONSUMPTION
   ===================================================== */

async function getTotalConsumption(stockId){

    const {data,error} =
    await supabaseClient
    .from("consumption_history")
    .select("quantity")
    .eq("stock_item_id",stockId);


    if(error){

        console.error(error);

        return 0;
    }


    return (data || []).reduce(
        (sum,row)=>
        sum + Number(row.quantity || 0),
        0
    );

}
