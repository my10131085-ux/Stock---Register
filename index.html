<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RHI MAGNESITA SPARE STOCK REGISTER</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef3f8;
  color:#222;
}

.login-page{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.login-box{
  width:95%;
  max-width:420px;
  background:white;
  padding:35px;
  border-radius:15px;
  box-shadow:0 5px 25px #999;
  text-align:center;
}

.login-box h1{
  margin:0;
  color:#b00000;
  font-size:25px;
}

.subtitle{
  margin:10px 0 25px;
  font-weight:bold;
  color:#555;
}

input,button,select{
  width:100%;
  padding:12px;
  margin:8px 0;
  border:1px solid #bbb;
  border-radius:7px;
  font-size:15px;
}

button{
  background:#b00000;
  color:white;
  border:none;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#850000;
}

#registerPage{
  display:none;
  padding:20px;
}

.header{
  background:#b00000;
  color:white;
  padding:18px;
  border-radius:10px;
  margin-bottom:15px;
}

.header h1{
  margin:0;
  font-size:25px;
}

.header p{
  margin:5px 0 0;
}

.controls{
  background:white;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.controls button{
  width:auto;
  min-width:150px;
}

.table-box{
  background:white;
  padding:10px;
  border-radius:10px;
  overflow:auto;
}

table{
  width:100%;
  min-width:1250px;
  border-collapse:collapse;
}

th{
  background:#333;
  color:white;
  padding:10px;
  border:1px solid #777;
  white-space:nowrap;
}

td{
  border:1px solid #aaa;
  padding:5px;
}

td input{
  margin:0;
  width:100%;
  padding:8px;
}

.sr{
  text-align:center;
  font-weight:bold;
}

.logout{
  background:#555 !important;
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->
<div class="login-page" id="loginPage">

  <div class="login-box">

    <h1>RHI MAGNESITA</h1>

    <div class="subtitle">
      SPARE STOCK REGISTER
    </div>

    <input
      type="text"
      id="username"
      placeholder="Enter Username"
    >

    <input
      type="password"
      id="password"
      placeholder="Enter Password"
    >

    <button onclick="login()">LOGIN</button>

    <p id="loginMessage"></p>

  </div>

</div>


<!-- STOCK REGISTER -->
<div id="registerPage">

  <div class="header">

    <h1>RHI MAGNESITA SPARE STOCK REGISTER</h1>

    <p>Spare Material Management System</p>

  </div>


  <div class="controls">

    <button onclick="saveData()">
      SAVE STOCK
    </button>

    <button onclick="addRow()">
      ADD ROW
    </button>

    <button onclick="clearData()">
      CLEAR DATA
    </button>

    <button class="logout" onclick="logout()">
      LOGOUT
    </button>

  </div>


  <div class="table-box">

    <table>

      <thead>

        <tr>
          <th>SR. NO.</th>
          <th>ITEM NAME</th>
          <th>ITEM CODE</th>
          <th>CLOSE STOCK</th>
          <th>OPEN STOCK</th>
          <th>RECEIVED</th>
          <th>RECEIVED DATE</th>
          <th>TOTAL ITEMS</th>
          <th>REMARKS</th>
        </tr>

      </thead>

      <tbody id="stockTable">

      </tbody>

    </table>

  </div>

</div>


<script>

const TOTAL_ROWS = 50;


/* LOGIN */

function login(){

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value.trim();

  /*
    Temporary login for testing.
    Change later when Supabase authentication
    is connected.
  */

  if(username === "admin" && password === "admin123"){

    document.getElementById("loginPage").style.display="none";

    document.getElementById("registerPage").style.display="block";

    loadData();

  }else{

    document.getElementById("loginMessage").innerHTML =
      "<span style='color:red'>Wrong Username or Password</span>";

  }

}


/* LOGOUT */

function logout(){

  document.getElementById("registerPage").style.display="none";

  document.getElementById("loginPage").style.display="flex";

  document.getElementById("username").value="";

  document.getElementById("password").value="";

}


/* CREATE 50 ROWS */

function createRows(){

  const table =
    document.getElementById("stockTable");

  table.innerHTML="";

  for(let i=1;i<=TOTAL_ROWS;i++){

    const row =
      document.createElement("tr");

    row.innerHTML = `

      <td class="sr">${i}</td>

      <td>
        <input type="text"
          id="name_${i}"
          placeholder="Item Name">
      </td>

      <td>
        <input type="text"
          id="code_${i}"
          placeholder="Item Code">
      </td>

      <td>
        <input type="number"
          id="close_${i}"
          min="0">
      </td>

      <td>
        <input type="number"
          id="open_${i}"
          min="0">
      </td>

      <td>
        <input type="number"
          id="received_${i}"
          min="0">
      </td>

      <td>
        <input type="date"
          id="date_${i}">
      </td>

      <td>
        <input type="number"
          id="total_${i}"
          min="0">
      </td>

      <td>
        <input type="text"
          id="remarks_${i}"
          placeholder="Remarks">
      </td>

    `;

    table.appendChild(row);

  }

}


/* SAVE DATA */

function saveData(){

  const data=[];

  for(let i=1;i<=TOTAL_ROWS;i++){

    data.push({

      name:
        document.getElementById("name_"+i).value,

      code:
        document.getElementById("code_"+i).value,

      close:
        document.getElementById("close_"+i).value,

      open:
        document.getElementById("open_"+i).value,

      received:
        document.getElementById("received_"+i).value,

      date:
        document.getElementById("date_"+i).value,

      total:
        document.getElementById("total_"+i).value,

      remarks:
        document.getElementById("remarks_"+i).value

    });

  }

  localStorage.setItem(
    "RHI_MAGNESITA_STOCK",
    JSON.stringify(data)
  );

  alert("Stock data saved successfully.");

}


/* LOAD DATA */

function loadData(){

  createRows();

  const saved =
    localStorage.getItem("RHI_MAGNESITA_STOCK");

  if(!saved) return;

  const data =
    JSON.parse(saved);

  data.forEach((item,index)=>{

    const i=index+1;

    if(document.getElementById("name_"+i))
      document.getElementById("name_"+i).value=item.name || "";

    if(document.getElementById("code_"+i))
      document.getElementById("code_"+i).value=item.code || "";

    if(document.getElementById("close_"+i))
      document.getElementById("close_"+i).value=item.close || "";

    if(document.getElementById("open_"+i))
      document.getElementById("open_"+i).value=item.open || "";

    if(document.getElementById("received_"+i))
      document.getElementById("received_"+i).value=item.received || "";

    if(document.getElementById("date_"+i))
      document.getElementById("date_"+i).value=item.date || "";

    if(document.getElementById("total_"+i))
      document.getElementById("total_"+i).value=item.total || "";

    if(document.getElementById("remarks_"+i))
      document.getElementById("remarks_"+i).value=item.remarks || "";

  });

}


/* ADD ROW */

function addRow(){

  const table =
    document.getElementById("stockTable");

  const number =
    table.rows.length + 1;

  if(number > 100){

    alert("Maximum 100 rows allowed.");

    return;
  }

  const row =
    document.createElement("tr");

  row.innerHTML = `

    <td class="sr">${number}</td>

    <td><input type="text" id="name_${number}"></td>

    <td><input type="text" id="code_${number}"></td>

    <td><input type="number" id="close_${number}"></td>

    <td><input type="number" id="open_${number}"></td>

    <td><input type="number" id="received_${number}"></td>

    <td><input type="date" id="date_${number}"></td>

    <td><input type="number" id="total_${number}"></td>

    <td><input type="text" id="remarks_${number}"></td>

  `;

  table.appendChild(row);

}


/* CLEAR DATA */

function clearData(){

  if(confirm("Are you sure you want to clear all stock data?")){

    localStorage.removeItem(
      "RHI_MAGNESITA_STOCK"
    );

    createRows();

  }

}

</script>

</body>
</html>
