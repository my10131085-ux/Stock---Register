<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RHI MAGNESITA - SPARE STOCK REGISTER</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef3f8;
  color:#222;
}

.login-page{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.login-box{
  width:95%;
  max-width:450px;
  background:white;
  padding:35px;
  border-radius:15px;
  box-shadow:0 5px 25px #999;
  text-align:center;
}

h1{
  margin:0;
  color:#b00000;
  font-size:27px;
}

.subtitle{
  margin:10px 0 25px;
  font-weight:bold;
  color:#555;
}

input,button{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:1px solid #bbb;
  border-radius:7px;
  font-size:15px;
}

button{
  background:#b00000;
  color:white;
  border:none;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#850000;
}

.link-button{
  background:none;
  color:#b00000;
  padding:5px;
}

.message{
  margin-top:10px;
  font-weight:bold;
}

#loginPage,
#forgotPage,
#resetPage{
  display:none;
}

#mainPage{
  display:none;
  min-height:100vh;
  padding:20px;
}

.header{
  background:#b00000;
  color:white;
  padding:18px;
  border-radius:10px;
  margin-bottom:15px;
}

.header h1{
  color:white;
  font-size:25px;
}

.header p{
  margin:5px 0 0;
}

.logout{
  width:auto;
  background:#555;
  float:right;
  padding:8px 15px;
}

.controls{
  background:white;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

.add{
  width:auto;
  padding:10px 18px;
}

.table-box{
  background:white;
  padding:10px;
  border-radius:10px;
  overflow:auto;
}

table{
  width:100%;
  min-width:1250px;
  border-collapse:collapse;
}

th{
  background:#333;
  color:white;
  padding:10px;
}

td{
  border:1px solid #aaa;
  padding:8px;
}

td input{
  margin:0;
  padding:8px;
}

.delete{
  width:auto;
  background:#555;
  padding:7px 12px;
}

.empty{
  text-align:center;
  padding:20px;
  color:#777;
}
</style>
</head>

<body>

<!-- LOGIN -->

<div class="login-page" id="loginPage">

<div class="login-box">

<h1>RHI MAGNESITA</h1>

<div class="subtitle">
SPARE STOCK REGISTER
</div>

<input
type="email"
id="loginEmail"
placeholder="Enter Email ID">

<input
type="password"
id="loginPassword"
placeholder="Enter Password">

<button onclick="login()">
LOGIN
</button>

<button
class="link-button"
onclick="showForgot()">
Forgot Password?
</button>

<p
id="loginMessage"
class="message">
</p>

</div>
</div>


<!-- FORGOT PASSWORD -->

<div class="login-page" id="forgotPage">

<div class="login-box">

<h1>RHI MAGNESITA</h1>

<div class="subtitle">
RESET PASSWORD
</div>

<input
type="email"
id="resetEmail"
placeholder="Enter Email ID">

<button onclick="sendResetLink()">
SEND RESET LINK
</button>

<button
class="link-button"
onclick="showLogin()">
Back to Login
</button>

<p
id="resetMessage"
class="message">
</p>

</div>
</div>


<!-- RESET PASSWORD -->

<div class="login-page" id="resetPage">

<div class="login-box">

<h1>RHI MAGNESITA</h1>

<div class="subtitle">
SET NEW PASSWORD
</div>

<input
type="password"
id="newPassword"
placeholder="Enter New Password">

<input
type="password"
id="confirmPassword"
placeholder="Confirm New Password">

<button onclick="updatePassword()">
UPDATE PASSWORD
</button>

<p
id="newPasswordMessage"
class="message">
</p>

</div>
</div>


<!-- MAIN PAGE -->

<div id="mainPage">

<div class="header">

<button
class="logout"
onclick="logout()">
LOGOUT
</button>

<h1>RHI MAGNESITA</h1>

<p>SPARE STOCK REGISTER</p>

</div>


<div class="controls">

<button
class="add"
onclick="addRow()">
+ ADD ITEM
</button>

<input
type="text"
id="search"
placeholder="Search Item / Code..."
onkeyup="searchItems()">

</div>


<div class="table-box">

<table>

<thead>

<tr>
<th>SR.NO</th>
<th>ITEM NAME</th>
<th>ITEM CODE</th>
<th>CLOSE STOCK</th>
<th>OPEN STOCK</th>
<th>RECEIVED</th>
<th>RECEIVED DATE</th>
<th>TOTAL ITEMS</th>
<th>REMARKS</th>
<th>ACTION</th>
</tr>

</thead>

<tbody id="stockBody">
</tbody>

</table>

</div>

</div>


<script>

/* =================================================
SUPABASE
================================================= */

const SUPABASE_URL =
"https://mooagaasvythwctcktcx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Zql7qJbZlj1R5H1ydOoqSg_F0WAdgd0";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =================================================
PAGE FUNCTIONS
================================================= */

function hideAll(){

document.getElementById("loginPage").style.display="none";

document.getElementById("forgotPage").style.display="none";

document.getElementById("resetPage").style.display="none";

document.getElementById("mainPage").style.display="none";

}


function showLogin(){

hideAll();

document.getElementById("loginPage").style.display="flex";

}


function showForgot(){

hideAll();

document.getElementById("forgotPage").style.display="flex";

}


function showReset(){

hideAll();

document.getElementById("resetPage").style.display="flex";

}


function showMain(){

hideAll();

document.getElementById("mainPage").style.display="block";

loadItems();

}


/* =================================================
LOGIN
================================================= */

async function login(){

const email =
document.getElementById("loginEmail").value.trim();

const password =
document.getElementById("loginPassword").value;

const msg =
document.getElementById("loginMessage");

if(!email || !password){

msg.innerText="Enter Email and Password.";

return;

}

msg.innerText="Logging in...";

const {error} =
await supabaseClient.auth.signInWithPassword({

email:email,

password:password

});

if(error){

msg.innerText=error.message;

return;

}

showMain();

}


/* =================================================
LOGOUT
================================================= */

async function logout(){

await supabaseClient.auth.signOut();

showLogin();

}


/* =================================================
FORGOT PASSWORD
================================================= */

async function sendResetLink(){

const email =
document.getElementById("resetEmail").value.trim();

const msg =
document.getElementById("resetMessage");

if(!email){

msg.innerText="Enter Email ID.";

return;

}

msg.innerText="Sending reset link...";

const redirectURL =
window.location.origin +
window.location.pathname;

const {error} =
await supabaseClient.auth.resetPasswordForEmail(

email,

{
redirectTo:redirectURL
}

);

if(error){

msg.innerText=error.message;

return;

}

msg.innerText=
"Reset link sent. Check your Gmail.";

}


/* =================================================
UPDATE PASSWORD
================================================= */

async function updatePassword(){

const password =
document.getElementById("newPassword").value;

const confirm =
document.getElementById("confirmPassword").value;

const msg =
document.getElementById("newPasswordMessage");

if(password.length<6){

msg.innerText=
"Password must be at least 6 characters.";

return;

}

if(password!==confirm){

msg.innerText=
"Password does not match.";

return;

}

msg.innerText="Updating password...";

const {error} =
await supabaseClient.auth.updateUser({

password:password

});

if(error){

msg.innerText=error.message;

return;

}

msg.innerText=
"Password updated successfully.";

setTimeout(showLogin,1500);

}


/* =================================================
LOAD STOCK FROM SUPABASE
================================================= */

async function loadItems(){

const {data,error} =
await supabaseClient

.from("stock_items")

.select("*")

.order("id",{ascending:true});

if(error){

console.log(error);

document.getElementById("stockBody").innerHTML=

'<tr><td colspan="10" class="empty">'+
"Database error: "+error.message+
"</td></tr>";

return;

}

renderItems(data || []);

}


/* =================================================
DISPLAY ITEMS
================================================= */

function renderItems(items){

const body =
document.getElementById("stockBody");

body.innerHTML="";

if(items.length===0){

body.innerHTML=
'<tr><td colspan="10" class="empty">'+
"No items available."
+
"</td></tr>";

return;

}

items.forEach(function(item,index){

const row =
document.createElement("tr");

const total =
(Number(item.open_stock)||0) +
(Number(item.received)||0);

row.innerHTML=`

<td>${index+1}</td>

<td>
<input
value="${esc(item.item_name)}"
onchange="updateItem(${item.id},'item_name',this.value)">
</td>

<td>
<input
value="${esc(item.item_code)}"
onchange="updateItem(${item.id},'item_code',this.value)">
</td>

<td>
<input
type="number"
value="${item.close_stock ?? 0}"
onchange="updateItem(${item.id},'close_stock',this.value)">
</td>

<td>
<input
type="number"
value="${item.open_stock ?? 0}"
onchange="updateItem(${item.id},'open_stock',this.value)">
</td>

<td>
<input
type="number"
value="${item.received ?? 0}"
onchange="updateItem(${item.id},'received',this.value)">
</td>

<td>
<input
type="date"
value="${item.received_date || ""}"
onchange="updateItem(${item.id},'received_date',this.value)">
</td>

<td>
${total}
</td>

<td>
<input
value="${esc(item.remarks)}"
onchange="updateItem(${item.id},'remarks',this.value)">
</td>

<td>
<button
class="delete"
onclick="deleteItem(${item.id})">
DELETE
</button>
</td>

`;

body.appendChild(row);

});

}


/* =================================================
ADD ITEM
================================================= */

async function addRow(){

const {data,error} =
await supabaseClient

.from("stock_items")

.insert({

item_name:"",
item_code:"",
close_stock:0,
open_stock:0,
received:0,
received_date:null,
remarks:""

})

.select();

if(error){

alert(error.message);

return;

}

loadItems();

}


/* =================================================
UPDATE ITEM
================================================= */

async function updateItem(id,field,value){

let updateData={};

if(
field==="close_stock" ||
field==="open_stock" ||
field==="received"
){

updateData[field]=Number(value)||0;

}else{

updateData[field]=value;

}

const {error} =
await supabaseClient

.from("stock_items")

.update(updateData)

.eq("id",id);

if(error){

alert(error.message);

return;

}

loadItems();

}


/* =================================================
DELETE ITEM
================================================= */

async function deleteItem(id){

if(!confirm("Delete this item?")){

return;

}

const {error} =
await supabaseClient

.from("stock_items")

.delete()

.eq("id",id);

if(error){

alert(error.message);

return;

}

loadItems();

}


/* =================================================
SEARCH
================================================= */

async function searchItems(){

const search =
document
.getElementById("search")
.value
.trim()
.toLowerCase();

const {data,error} =
await supabaseClient

.from("stock_items")

.select("*")

.order("id",{ascending:true});

if(error){

console.log(error);

return;

}

if(!search){

renderItems(data || []);

return;

}

const filtered =
(data || []).filter(function(item){

return (

String(item.item_name || "")
.toLowerCase()
.includes(search)

||

String(item.item_code || "")
.toLowerCase()
.includes(search)

||

String(item.remarks || "")
.toLowerCase()
.includes(search)

);

});

renderItems(filtered);

}


/* =================================================
ESCAPE HTML
================================================= */

function esc(value){

return String(value ?? "")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =================================================
CHECK SESSION
================================================= */

async function checkSession(){

const {data} =
await supabaseClient.auth.getSession();

if(data.session){

showMain();

}else{

showLogin();

}

}


/* =================================================
PASSWORD RECOVERY
================================================= */

supabaseClient.auth.onAuthStateChange(

function(event,session){

if(event==="PASSWORD_RECOVERY"){

showReset();

}

});


/* =================================================
AUTO REFRESH
================================================= */

setInterval(async function(){

const main =
document.getElementById("mainPage");

if(main.style.display==="block"){

const search =
document.getElementById("search").value;

if(!search){

await loadItems();

}

}

},5000);


/* =================================================
START
================================================= */

window.addEventListener(
"load",
function(){

checkSession();

}
);

</script>

</body>
</html>
