<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RHI MAGNESITA - Spare Stock Register</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}
.container{
    max-width:1000px;
    margin:30px auto;
    padding:20px;
}
.card{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 15px #ccc;
}
h1,h2{text-align:center}
input,button{
    width:100%;
    padding:12px;
    margin:7px 0;
    border-radius:6px;
    border:1px solid #ccc;
    font-size:16px;
}
button{
    background:#b00000;
    color:white;
    border:none;
    cursor:pointer;
    font-weight:bold;
}
button:hover{background:#800000}
.hidden{display:none}
.msg{
    text-align:center;
    margin:10px 0;
    font-weight:bold;
}
table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}
th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:left;
}
th{background:#b00000;color:white}
.logout{
    background:#555;
    max-width:150px;
    float:right;
}
.small-btn{
    width:auto;
    padding:8px 12px;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->
<div id="loginPage" class="card">
    <h1>RHI MAGNESITA</h1>
    <h2>SPARE STOCK REGISTER</h2>

    <input
        type="email"
        id="loginEmail"
        placeholder="Email"
    >

    <input
        type="password"
        id="loginPassword"
        placeholder="Password"
    >

    <button id="loginButton" type="button">
        LOGIN
    </button>

    <div id="loginMessage" class="msg"></div>
</div>


<!-- MAIN -->
<div id="mainPage" class="card hidden">

    <button
        id="logoutButton"
        class="logout"
        type="button">
        LOGOUT
    </button>

    <h1>RHI MAGNESITA</h1>
    <h2>SPARE STOCK REGISTER</h2>

    <hr>

    <h3>Add Stock</h3>

    <input
        type="text"
        id="itemName"
        placeholder="Item Name"
    >

    <input
        type="text"
        id="itemCode"
        placeholder="Item Code"
    >

    <input
        type="number"
        id="quantity"
        placeholder="Quantity"
        min="1"
    >

    <button id="addButton" type="button">
        ADD STOCK
    </button>

    <div id="stockMessage" class="msg"></div>

    <hr>

    <h3>Current Stock</h3>

    <table>
        <thead>
            <tr>
                <th>Item Name</th>
                <th>Item Code</th>
                <th>Quantity</th>
            </tr>
        </thead>

        <tbody id="stockTable">
        </tbody>
    </table>

</div>

</div>


<script>

/* =====================================================
   SUPABASE SETTINGS
   =====================================================

   IMPORTANT:
   Neeche apna Supabase URL aur ANON KEY lagana hai.
*/

const SUPABASE_URL = "https://mooagaasvythwctcktcx.supabase.co";

const SUPABASE_ANON_KEY = "sb_publishable_Zql7qJbZlj1R5H1ydOoqSg_F0WAdgd0";


/* Supabase connection */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =====================================================
   ELEMENTS
   ===================================================== */

const loginPage =
    document.getElementById("loginPage");

const mainPage =
    document.getElementById("mainPage");

const loginButton =
    document.getElementById("loginButton");

const logoutButton =
    document.getElementById("logoutButton");

const loginMessage =
    document.getElementById("loginMessage");

const stockMessage =
    document.getElementById("stockMessage");

const stockTable =
    document.getElementById("stockTable");


/* =====================================================
   LOGIN
   ===================================================== */

async function login(){

    const email =
        document.getElementById("loginEmail")
        .value.trim();

    const password =
        document.getElementById("loginPassword")
        .value;

    if(!email || !password){

        loginMessage.style.color="red";

        loginMessage.textContent =
            "Enter Email and Password.";

        return;
    }

    loginMessage.style.color="#333";

    loginMessage.textContent =
        "Logging in...";

    try{

        const result =
            await supabaseClient.auth.signInWithPassword({
                email:email,
                password:password
            });

        if(result.error){

            loginMessage.style.color="red";

            loginMessage.textContent =
                result.error.message;

            return;
        }

        loginMessage.style.color="green";

        loginMessage.textContent =
            "Login successful.";

        loginPage.classList.add("hidden");

        mainPage.classList.remove("hidden");

        loadStock();

    }catch(error){

        console.error(error);

        loginMessage.style.color="red";

        loginMessage.textContent =
            "Login error: " + error.message;
    }
}


/* =====================================================
   LOGOUT
   ===================================================== */

async function logout(){

    await supabaseClient.auth.signOut();

    mainPage.classList.add("hidden");

    loginPage.classList.remove("hidden");

    document.getElementById("loginPassword").value="";

    loginMessage.textContent="";
}


/* =====================================================
   ADD STOCK
   ===================================================== */

async function addStock(){

    const name =
        document.getElementById("itemName")
        .value.trim();

    const code =
        document.getElementById("itemCode")
        .value.trim();

    const qty =
        Number(
            document.getElementById("quantity").value
        );

    if(!name){

        showMessage(
            "Please enter item name.",
            "red"
        );

        return;
    }

    if(!code){

        showMessage(
            "Please enter item code.",
            "red"
        );

        return;
    }

    if(!qty || qty <= 0){

        showMessage(
            "Please enter valid quantity.",
            "red"
        );

        return;
    }

    showMessage(
        "Saving...",
        "#333"
    );

    try{

        /*
          IMPORTANT:
          Ye table Supabase mein baad mein banayenge.
        */

        const {error} =
            await supabaseClient
            .from("stock_items")
            .insert({
                item_name:name,
                item_code:code,
                quantity:qty
            });

        if(error){

            console.error(error);

            showMessage(
                error.message,
                "red"
            );

            return;
        }

        showMessage(
            "Stock added successfully.",
            "green"
        );

        document.getElementById("itemName").value="";
        document.getElementById("itemCode").value="";
        document.getElementById("quantity").value="";

        loadStock();

    }catch(error){

        console.error(error);

        showMessage(
            "Error: " + error.message,
            "red"
        );
    }
}


/* =====================================================
   LOAD STOCK
   ===================================================== */

async function loadStock(){

    stockTable.innerHTML="";

    try{

        const {data,error} =
            await supabaseClient
            .from("stock_items")
            .select("*")
            .order("id",{ascending:false});

        if(error){

            console.error(error);

            stockTable.innerHTML =
                "<tr><td colspan='3'>Unable to load stock.</td></tr>";

            return;
        }

        if(!data || data.length===0){

            stockTable.innerHTML =
                "<tr><td colspan='3'>No stock found.</td></tr>";

            return;
        }

        data.forEach(item=>{

            const row =
                document.createElement("tr");

            row.innerHTML = `
                <td>${escapeHtml(item.item_name)}</td>
                <td>${escapeHtml(item.item_code)}</td>
                <td>${item.quantity}</td>
            `;

            stockTable.appendChild(row);
        });

    }catch(error){

        console.error(error);

        stockTable.innerHTML =
            "<tr><td colspan='3'>Error loading stock.</td></tr>";
    }
}


/* =====================================================
   MESSAGE
   ===================================================== */

function showMessage(text,color){

    stockMessage.style.color=color;

    stockMessage.textContent=text;
}


/* =====================================================
   SECURITY
   ===================================================== */

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =====================================================
   BUTTON EVENTS
   ===================================================== */

loginButton.addEventListener(
    "click",
    login
);

logoutButton.addEventListener(
    "click",
    logout
);

document.getElementById("addButton")
    .addEventListener(
        "click",
        addStock
    );


/* =====================================================
   ENTER KEY LOGIN
   ===================================================== */

document.getElementById("loginPassword")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key==="Enter"){
                login();
            }

        }
    );


/* =====================================================
   CHECK EXISTING SESSION
   ===================================================== */

async function checkSession(){

    try{

        const {data} =
            await supabaseClient.auth.getSession();

        if(data && data.session){

            loginPage.classList.add("hidden");

            mainPage.classList.remove("hidden");

            loadStock();
        }

    }catch(error){

        console.error(error);
    }
}


checkSession();

</script>

</body>
</html>
