<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RHI MAGNESITA - Spare Stock Register</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f3f3;
color:#222
}

.container{
max-width:1200px;
margin:20px auto;
padding:15px
}

.card{
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 3px 15px #ccc
}

h1,h2{text-align:center}

input,button,select,textarea{
width:100%;
padding:11px;
margin:6px 0;
border-radius:6px;
border:1px solid #ccc;
font-size:15px
}

button{
background:#b00000;
color:white;
border:none;
cursor:pointer;
font-weight:bold
}

.hidden{
display:none!important
}

.msg{
text-align:center;
margin:10px 0;
font-weight:bold
}

.logout{
background:#555;
width:auto;
min-width:120px;
float:right
}

.form-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px
}

.table-wrap{
overflow-x:auto
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
min-width:1000px
}

th,td{
border:1px solid #ddd;
padding:9px;
text-align:center
}

th{
background:#b00000;
color:white
}

.action-btn{
width:auto;
padding:7px 10px;
margin:2px;
font-size:13px
}

.edit{background:#1769aa}
.delete{background:#555}
.consume{background:#d35400}

@media(max-width:700px){

.container{
padding:8px;
margin:5px auto
}

.card{
padding:12px
}

.form-grid{
grid-template-columns:1fr
}

h1{font-size:25px}
h2{font-size:19px}

}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->

<div id="loginPage" class="card">

<h1>RHI MAGNESITA</h1>
<h2>SPARE STOCK REGISTER</h2>

<input
type="email"
id="loginEmail"
placeholder="Email">

<input
type="password"
id="loginPassword"
placeholder="Password">

<button id="loginButton">
LOGIN
</button>

<button
id="forgotButton"
type="button"
style="background:#555;">
FORGOT PASSWORD
</button>

<div id="loginMessage" class="msg"></div>

</div>


<!-- RESET PASSWORD -->

<div id="resetPage" class="card hidden">

<h2>RESET PASSWORD</h2>

<input
type="password"
id="newPassword"
placeholder="New Password">

<input
type="password"
id="confirmPassword"
placeholder="Confirm New Password">

<button id="resetButton">
UPDATE PASSWORD
</button>

<div id="resetMessage" class="msg"></div>

</div>


<!-- MAIN -->

<div id="mainPage" class="card hidden">

<button
id="logoutButton"
class="logout">
LOGOUT
</button>

<h1>RHI MAGNESITA</h1>
<h2>SPARE STOCK REGISTER</h2>

<hr>

<h3>ADD STOCK</h3>

<div class="form-grid">

<input
type="text"
id="itemName"
placeholder="Item Name">

<input
type="text"
id="itemCode"
placeholder="Item Code">

<input
type="number"
id="stock"
placeholder="Stock"
min="0">

<input
type="number"
id="received"
placeholder="Received"
min="0">

<input
type="date"
id="receivedDate">

<input
type="text"
id="remarks"
placeholder="Remarks">

</div>

<button id="addButton">
ADD STOCK
</button>

<div id="stockMessage" class="msg"></div>

<hr>

<h3>STOCK REGISTER</h3>

<div class="table-wrap">

<table>

<thead>

<tr>
<th>SR.NO</th>
<th>ITEM NAME</th>
<th>ITEM CODE</th>
<th>STOCK</th>
<th>RECEIVED</th>
<th>TOTAL STOCK</th>
<th>CONSUMPTION</th>
<th>ACTION</th>
</tr>

</thead>

<tbody id="stockTable">
</tbody>

</table>

</div>


<!-- CONSUMPTION -->

<div
id="consumptionBox"
class="hidden">

<hr>

<h3>CONSUMPTION</h3>

<input
type="hidden"
id="consumeId">

<input
type="number"
id="consumeQty"
placeholder="Consumption Quantity"
min="1">

<textarea
id="consumptionRemarks"
placeholder="Remarks"
rows="3">
</textarea>

<button
id="saveConsumptionButton"
class="consume">
SAVE CONSUMPTION
</button>

<button
id="cancelConsumptionButton"
style="background:#555;">
CANCEL
</button>

<div
id="consumptionMessage"
class="msg">
</div>

</div>


<hr>

<h3>CONSUMPTION HISTORY</h3>

<div class="table-wrap">

<table>

<thead>

<tr>
<th>DATE</th>
<th>ITEM NAME</th>
<th>ITEM CODE</th>
<th>QUANTITY USED</th>
<th>REMARKS</th>
</tr>

</thead>

<tbody id="historyTable">
</tbody>

</table>

</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://mooagaasvythwctcktcx.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_Zql7qJbZlj1R5H1ydOoqSg_F0WAdgd0";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);


const loginPage =
document.getElementById("loginPage");

const resetPage =
document.getElementById("resetPage");

const mainPage =
document.getElementById("mainPage");

const loginMessage =
document.getElementById("loginMessage");

const resetMessage =
document.getElementById("resetMessage");

const stockMessage =
document.getElementById("stockMessage");

const consumptionMessage =
document.getElementById("consumptionMessage");

const stockTable =
document.getElementById("stockTable");

const historyTable =
document.getElementById("historyTable");

const consumptionBox =
document.getElementById("consumptionBox");


/* LOGIN */

async function login(){

const email =
document.getElementById("loginEmail")
.value.trim();

const password =
document.getElementById("loginPassword")
.value;

if(!email || !password){

loginMessage.style.color="red";

loginMessage.textContent =
"Enter Email and Password.";

return;
}

loginMessage.textContent =
"Logging in...";

const {error} =
await supabaseClient.auth
.signInWithPassword({

email:email,
password:password

});

if(error){

loginMessage.style.color="red";

loginMessage.textContent =
error.message;

return;
}

loginPage.classList.add("hidden");

resetPage.classList.add("hidden");

mainPage.classList.remove("hidden");

await loadAll();

}


/* FORGOT PASSWORD */

async function forgotPassword(){

const email =
document.getElementById("loginEmail")
.value.trim();

if(!email){

loginMessage.style.color="red";

loginMessage.textContent =
"First enter your email.";

return;
}

loginMessage.textContent =
"Sending reset link...";

const {error} =
await supabaseClient.auth
.resetPasswordForEmail(
email,
{
redirectTo:
window.location.origin +
window.location.pathname
}
);

if(error){

loginMessage.style.color="red";

loginMessage.textContent =
error.message;

return;
}

loginMessage.style.color="green";

loginMessage.textContent =
"Password reset link sent to your email.";

}


/* RESET PASSWORD */

async function resetPassword(){

const password =
document.getElementById("newPassword")
.value;

const confirm =
document.getElementById("confirmPassword")
.value;

if(!password || !confirm){

resetMessage.style.color="red";

resetMessage.textContent =
"Enter both passwords.";

return;
}

if(password !== confirm){

resetMessage.style.color="red";

resetMessage.textContent =
"Passwords do not match.";

return;
}

if(password.length<6){

resetMessage.style.color="red";

resetMessage.textContent =
"Password must be at least 6 characters.";

return;
}

const {error} =
await supabaseClient.auth
.updateUser({
password:password
});

if(error){

resetMessage.style.color="red";

resetMessage.textContent =
error.message;

return;
}

resetMessage.style.color="green";

resetMessage.textContent =
"Password updated successfully.";

}


/* LOGOUT */

async function logout(){

await supabaseClient.auth.signOut();

mainPage.classList.add("hidden");

resetPage.classList.add("hidden");

loginPage.classList.remove("hidden");

}


/* ADD STOCK */

async function addStock(){

const name =
document.getElementById("itemName")
.value.trim();

const code =
document.getElementById("itemCode")
.value.trim();

const stock =
Number(
document.getElementById("stock").value
)||0;

const received =
Number(
document.getElementById("received").value
)||0;

const receivedDate =
document.getElementById("receivedDate")
.value;

const remarks =
document.getElementById("remarks")
.value.trim();

if(!name){

showStockMessage(
"Enter Item Name.",
"red"
);

return;
}

if(!code){

showStockMessage(
"Enter Item Code.",
"red"
);

return;
}

if(stock<0 || received<0){

showStockMessage(
"Invalid quantity.",
"red"
);

return;
}

if(stock===0 && received===0){

showStockMessage(
"Enter Stock or Received quantity.",
"red"
);

return;
}

const total =
stock+received;

const {error} =
await supabaseClient
.from("stock_items")
.insert({

item_name:name,
item_code:code,
open_stock:stock,
received:received,
quantity:total,
entry_date:
receivedDate ||
new Date().toISOString(),
remarks:remarks

});

if(error){

showStockMessage(
error.message,
"red"
);

return;
}

showStockMessage(
"Stock added successfully.",
"green"
);

clearForm();

await loadAll();

}


/* LOAD ALL */

async function loadAll(){

await loadStock();

await loadHistory();

}


/* LOAD STOCK */

async function loadStock(){

stockTable.innerHTML="";

const {data,error} =
await supabaseClient
.from("stock_items")
.select("*")
.order("id",{ascending:false});

if(error){

stockTable.innerHTML=
`<tr>
<td colspan="8">
${escapeHtml(error.message)}
</td>
</tr>`;

return;
}

if(!data || data.length===0){

stockTable.innerHTML=
`<tr>
<td colspan="8">
No stock found.
</td>
</tr>`;

return;
}

data.forEach(
(item,index)=>{

const row =
document.createElement("tr");

row.innerHTML=`

<td>${index+1}</td>

<td>
${escapeHtml(item.item_name||"")}
</td>

<td>
${escapeHtml(item.item_code||"")}
</td>

<td>
${Number(item.open_stock||0)}
</td>

<td>
${Number(item.received||0)}
</td>

<td>
<b>${Number(item.quantity||0)}</b>
</td>

<td>

<button
class="action-btn consume"
onclick="openConsumption('${item.id}')">
CONSUMPTION
</button>

</td>

<td>

<button
class="action-btn edit"
onclick="editStock('${item.id}')">
EDIT
</button>

<button
class="action-btn delete"
onclick="deleteStock('${item.id}')">
DELETE
</button>

</td>

`;

stockTable.appendChild(row);

});

}


/* OPEN CONSUMPTION */

function openConsumption(id){

document.getElementById(
"consumeId"
).value=id;

document.getElementById(
"consumeQty"
).value="";

document.getElementById(
"consumptionRemarks"
).value="";

consumptionMessage.textContent="";

consumptionBox.classList.remove(
"hidden"
);

consumptionBox.scrollIntoView({
behavior:"smooth"
});

}


/* SAVE CONSUMPTION */

async function saveConsumption(){

const id =
document.getElementById(
"consumeId"
).value;

const qty =
Number(
document.getElementById(
"consumeQty"
).value
);

const remarks =
document.getElementById(
"consumptionRemarks"
).value.trim();

if(!id){

consumptionMessage.style.color="red";

consumptionMessage.textContent =
"Please select an item.";

return;
}

if(!qty || qty<=0){

consumptionMessage.style.color="red";

consumptionMessage.textContent =
"Enter valid consumption quantity.";

return;
}

const {data:item,error:itemError} =
await supabaseClient
.from("stock_items")
.select("*")
.eq("id",id)
.single();

if(itemError){

consumptionMessage.style.color="red";

consumptionMessage.textContent =
itemError.message;

return;
}

const current =
Number(item.quantity||0);

if(qty>current){

consumptionMessage.style.color="red";

consumptionMessage.textContent =
"Consumption cannot be greater than Total Stock.";

return;
}

const newTotal =
current-qty;

const {error:updateError} =
await supabaseClient
.from("stock_items")
.update({
quantity:newTotal
})
.eq("id",id);

if(updateError){

consumptionMessage.style.color="red";

consumptionMessage.textContent =
updateError.message;

return;
}

const {error:historyError} =
await supabaseClient
.from("consumption_history")
.insert({

stock_item_id:id,
item_name:item.item_name,
item_code:item.item_code,
quantity:qty,
consumption_date:
new Date().toISOString(),
remarks:remarks

});

if(historyError){

consumptionMessage.style.color="red";

consumptionMessage.textContent =
historyError.message;

return;
}

consumptionMessage.style.color="green";

consumptionMessage.textContent =
"Consumption saved successfully.";

document.getElementById(
"consumeQty"
).value="";

document.getElementById(
"consumptionRemarks"
).value="";

consumptionBox.classList.add(
"hidden"
);

await loadAll();

}


/* HISTORY */

async function loadHistory(){

historyTable.innerHTML="";

const {data,error} =
await supabaseClient
.from("consumption_history")
.select("*")
.order(
"consumption_date",
{ascending:false}
);

if(error){

historyTable.innerHTML=
`<tr>
<td colspan="5">
${escapeHtml(error.message)}
</td>
</tr>`;

return;
}

if(!data || data.length===0){

historyTable.innerHTML=
`<tr>
<td colspan="5">
No consumption history.
</td>
</tr>`;

return;
}

data.forEach(item=>{

const row =
document.createElement("tr");

const date =
item.consumption_date
?
new Date(
item.consumption_date
).toLocaleDateString("en-IN")
:
"";

row.innerHTML=`

<td>${date}</td>

<td>
${escapeHtml(item.item_name||"")}
</td>

<td>
${escapeHtml(item.item_code||"")}
</td>

<td>
<b>${Number(item.quantity||0)}</b>
</td>

<td>
${escapeHtml(item.remarks||"")}
</td>

`;

historyTable.appendChild(row);

});

}
    /* EDIT STOCK */

async function editStock(id){

    const {data,error} =
    await supabaseClient
    .from("stock_items")
    .select("*")
    .eq("id",id)
    .single();

    if(error){

        alert(error.message);
        return;
    }

    const name =
    prompt(
        "Item Name:",
        data.item_name || ""
    );

    if(name===null)return;

    const code =
    prompt(
        "Item Code:",
        data.item_code || ""
    );

    if(code===null)return;

    const stock =
    prompt(
        "Stock:",
        data.open_stock || 0
    );

    if(stock===null)return;

    const received =
    prompt(
        "Received:",
        data.received || 0
    );

    if(received===null)return;

    const newStock =
    Number(stock) || 0;

    const newReceived =
    Number(received) || 0;

    const oldTotal =
    Number(data.quantity || 0);

    const oldBase =
    Number(data.open_stock || 0) +
    Number(data.received || 0);

    const used =
    Math.max(
        0,
        oldBase - oldTotal
    );

    const newTotal =
    Math.max(
        0,
        newStock +
        newReceived -
        used
    );

    const {error:updateError} =
    await supabaseClient
    .from("stock_items")
    .update({

        item_name:name.trim(),

        item_code:code.trim(),

        open_stock:newStock,

        received:newReceived,

        quantity:newTotal

    })
    .eq("id",id);

    if(updateError){

        alert(updateError.message);
        return;
    }

    alert(
        "Stock updated successfully."
    );

    await loadAll();

}


/* DELETE STOCK */

async function deleteStock(id){

    const yes =
    confirm(
        "Are you sure you want to delete this item?"
    );

    if(!yes)return;

    await supabaseClient
    .from("consumption_history")
    .delete()
    .eq("stock_item_id",id);

    const {error} =
    await supabaseClient
    .from("stock_items")
    .delete()
    .eq("id",id);

    if(error){

        alert(error.message);
        return;
    }

    alert(
        "Stock deleted successfully."
    );

    await loadAll();

}


/* CLEAR FORM */

function clearForm(){

    document.getElementById(
        "itemName"
    ).value="";

    document.getElementById(
        "itemCode"
    ).value="";

    document.getElementById(
        "stock"
    ).value="";

    document.getElementById(
        "received"
    ).value="";

    document.getElementById(
        "receivedDate"
    ).value="";

    document.getElementById(
        "remarks"
    ).value="";

}


/* MESSAGE */

function showStockMessage(
    text,
    color
){

    stockMessage.style.color =
    color;

    stockMessage.textContent =
    text;

}


/* ESCAPE HTML */

function escapeHtml(value){

    return String(value ?? "")

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}


/* BUTTON EVENTS */

document.getElementById(
    "loginButton"
)
.addEventListener(
    "click",
    login
);

document.getElementById(
    "forgotButton"
)
.addEventListener(
    "click",
    forgotPassword
);

document.getElementById(
    "resetButton"
)
.addEventListener(
    "click",
    resetPassword
);

document.getElementById(
    "logoutButton"
)
.addEventListener(
    "click",
    logout
);

document.getElementById(
    "addButton"
)
.addEventListener(
    "click",
    addStock
);

document.getElementById(
    "saveConsumptionButton"
)
.addEventListener(
    "click",
    saveConsumption
);

document.getElementById(
    "cancelConsumptionButton"
)
.addEventListener(
    "click",
    function(){

        consumptionBox.classList.add(
            "hidden"
        );

    }
);


/* ENTER KEY LOGIN */

document.getElementById(
    "loginPassword"
)
.addEventListener(
    "keydown",
    function(event){

        if(event.key==="Enter"){

            login();

        }

    }
);


/* PASSWORD RECOVERY */

supabaseClient.auth.onAuthStateChange(
    function(event,session){

        if(event==="PASSWORD_RECOVERY"){

            loginPage.classList.add(
                "hidden"
            );

            mainPage.classList.add(
                "hidden"
            );

            resetPage.classList.remove(
                "hidden"
            );

        }

    }
);


/* CHECK SESSION */

async function checkSession(){

    const {data} =
    await supabaseClient
    .auth
    .getSession();

    if(data && data.session){

        loginPage.classList.add(
            "hidden"
        );

        mainPage.classList.remove(
            "hidden"
        );

        await loadAll();

    }

}

checkSession();

</script>

</body>
</html>
