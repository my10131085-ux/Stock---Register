const supabaseClient =
supabase.createClient(

// PAGE FUNCTIONS

function hideAll(){
  document.getElementById("loginPage").style.display="none";
  document.getElementById("forgotPage").style.display="none";
  document.getElementById("resetPage").style.display="none";
  document.getElementById("mainPage").style.display="none";
}

function showLogin(){
  hideAll();
  document.getElementById("loginPage").style.display="flex";
}

function showForgot(){
  hideAll();
  document.getElementById("forgotPage").style.display="flex";
}


// LOGIN

async function login(){

  const email =
  document.getElementById("loginEmail").value.trim();

  const password =
  document.getElementById("loginPassword").value;

  const msg =
  document.getElementById("loginMessage");

  msg.innerText="Logging in...";

  const {data,error} =
  await supabaseClient.auth.signInWithPassword({
    email:email,
    password:password
  });

  if(error){
    msg.innerText=error.message;
    return;
  }

  msg.innerText="Login successful";

  showMain();

}


// FORGOT PASSWORD

async function sendResetLink(){

  const email =
  document.getElementById("resetEmail").value.trim();

  const msg =
  document.getElementById("resetMessage");

  if(!email){
    msg.innerText="Enter Email ID";
    return;
  }

  msg.innerText="Sending reset link...";

  const redirectURL =
    window.location.origin +
    window.location.pathname;

  const {error} =
  await supabaseClient.auth.resetPasswordForEmail(
    email,
    {
      redirectTo:redirectURL
    }
  );

  if(error){
    msg.innerText=error.message;
    return;
  }

  msg.innerText=
  "Reset link sent. Please check your Gmail.";
}


// UPDATE PASSWORD

async function updatePassword(){

  const password =
  document.getElementById("newPassword").value;

  const confirm =
  document.getElementById("confirmPassword").value;

  const msg =
  document.getElementById("newPasswordMessage");

  if(password.length < 6){
    msg.innerText=
    "Password must be at least 6 characters.";
    return;
  }

  if(password !== confirm){
    msg.innerText=
    "Password does not match.";
    return;
  }

  const {error} =
  await supabaseClient.auth.updateUser({
    password:password
