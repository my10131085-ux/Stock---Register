<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RHI MAGNESITA - SPARE STOCK REGISTER</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef3f8;
  color:#222;
}

.login-page{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.login-box{
  width:95%;
  max-width:420px;
  background:#fff;
  padding:35px;
  border-radius:15px;
  box-shadow:0 5px 25px #999;
  text-align:center;
}

.login-box h1{
  margin:0;
  color:#b00000;
  font-size:27px;
}

.subtitle{
  margin:10px 0 25px;
  font-weight:bold;
  color:#555;
}

input,button,select{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #bbb;
  border-radius:7px;
  font-size:15px;
}

button{
  background:#b00000;
  color:#fff;
  border:0;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#850000;
}

.link{
  background:none;
  color:#b00000;
}

.msg{
  font-weight:bold;
}

.page{
  display:none;
  min-height:100vh;
  padding:20px;
}

.header{
  background:#b00000;
  color:#fff;
  padding:18px;
  border-radius:10px;
  margin-bottom:15px;
}

.header h1{
  margin:0;
  color:#fff;
  font-size:25px;
}

.header p{
  margin:5px 0;
}

.logout{
  float:right;
  width:auto;
  background:#555;
  padding:8px 15px;
}

.controls,
.section{
  background:#fff;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

.add{
  width:auto;
  padding:10px 18px;
}

.table-box{
  background:#fff;
  padding:10px;
  border-radius:10px;
  overflow:auto;
}

table{
  width:100%;
  min-width:1250px;
  border-collapse:collapse;
}

th{
  background:#333;
  color:#fff;
  padding:10px;
  white-space:nowrap;
}

td{
  border:1px solid #aaa;
  padding:6px;
}

td input,
td select{
  margin:0;
  padding:8px;
}

.delete{
  width:auto;
  background:#555;
  padding:7px 12px;
}

.section h2{
  color:#8b0000;
  margin-top:0;
}

.cons-controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.cons-controls>*{
  flex:1;
  min-width:150px;
}

.cons-controls button{
  max-width:250px;
}

.small-table{
  min-width:850px;
}

.small-table th{
  background:#18233b;
}

.empty{
  text-align:center;
  padding:20px;
  color:#777;
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div class="login-page" id="loginPage">

  <div class="login-box">

    <h1>RHI MAGNESITA</h1>

    <div class="subtitle">
      SPARE STOCK REGISTER
    </div>

    <input
      type="email"
      id="loginEmail"
      placeholder="Enter Email ID">

    <input
      type="password"
      id="loginPassword"
      placeholder="Enter Password">

    <button onclick="login()">
      LOGIN
    </button>

    <button
      class="link"
      onclick="showForgot()">
      Forgot Password?
    </button>

    <p id="loginMessage" class="msg"></p>

  </div>
</div>


<!-- ================= FORGOT PASSWORD ================= -->

<div class="login-page" id="forgotPage" style="display:none;">

  <div class="login-box">

    <h1>RHI MAGNESITA</h1>

    <div class="subtitle">
      RESET PASSWORD
    </div>

    <input
      type="email"
      id="resetEmail"
      placeholder="Enter Email ID">

    <button onclick="sendResetLink()">
      SEND RESET LINK
    </button>

    <button
      class="link"
      onclick="showLogin()">
      Back to Login
    </button>

    <p id="resetMessage" class="msg"></p>

  </div>
</div>
